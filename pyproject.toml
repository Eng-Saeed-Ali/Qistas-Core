[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qistas-core"
version = "1.0.0"
description = "Deterministic Bilingual (Arabic-English) Financial Reconciliation, Double-Entry Ledger & Cryptographic Audit Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Qistas Systems Engineering" }]
dependencies = [
    "duckdb>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
qistas = "qistas.cli_visualizer:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.8.0",
]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
