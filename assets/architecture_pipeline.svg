    <text x="26" y="195" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">P3 Iterative Stack B&amp;B (2 ≤ k ≤ 4, ≤ 10k exp)</text>
    <text x="26" y="213" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10">P4 residual_cents · Partial / Overpay / Orphan</text>

    <rect x="16" y="236" width="308" height="70" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="26" y="256" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">ledger.py · Double-Entry &amp; BLAKE2b Chain</text>
    <text x="26" y="275" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">5 AccountCodes · ∑ Debits == ∑ Credits &gt; 0</text>
    <text x="26" y="293" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10">Genesis 0x5149535441533236 · O(N) Audit Verify</text>
