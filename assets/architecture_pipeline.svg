    <text x="26" y="160" fill="#fbbf24" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">DuckDB 2.0 &amp; Stdlib ASCII CLI</text>
    <text x="26" y="179" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">In-Memory BIGINT SQL Views (v_trial_balance)</text>
    <text x="26" y="197" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10">cli_visualizer.py · 100% Stdlib · PEP 562</text>

    <rect x="16" y="224" width="278" height="82" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="26" y="244" fill="#fbbf24" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">AST Fitness &amp; 1,050-Seed Oracle</text>
    <text x="26" y="263" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">FF-1..FF-6: 0 Float/Div/Rec, ≤ 60 LOC/fn</text>
    <text x="26" y="281" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">FF-7/7b: itertools.combinations Oracle</text>
    <text x="26" y="297" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10">FF-8: SVG &amp; Docs Gate · 1,050/1,050 Parity</text>
  </g>
