  <text x="550" y="34" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="0.8">QISTAS-CORE — ZERO-FLOAT FUNCTIONAL CORE / IMPERATIVE SHELL ARCHITECTURE</text>
