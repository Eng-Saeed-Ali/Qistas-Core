    <rect x="16" y="52" width="278" height="54" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="72" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">Stage 1 · UTF-8 &amp; 4 MiB Cap</text>
    <text x="26" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">len(utf8) ≤ 4,194,304 · Ban NUL &amp; Surrogates</text>

    <rect x="16" y="116" width="278" height="54" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="136" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">Stage 2 · O(n) Depth-8 Scanner</text>
    <text x="26" y="156" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">Iterative Quote/Escape State · Depth ≤ 8</text>

    <rect x="16" y="180" width="278" height="54" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="200" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">Stage 3 · Zero-Float json.loads</text>
    <text x="26" y="220" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">parse_float=str · No NaN/Inf · No Dup Keys</text>

    <rect x="16" y="244" width="278" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="264" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">Stage 4 · RecordRejection Gate</text>
